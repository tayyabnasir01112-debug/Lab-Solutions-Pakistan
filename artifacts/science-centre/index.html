<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Science Centre Pakistan — Advanced Laboratory Equipment & Analytical Instruments</title>
    <meta name="description" content="Science Centre is Pakistan's premier B2B distributor of advanced laboratory equipment, analytical instruments, and diagnostic solutions. Official partner of Luminex and Merck for 39 years." />
    <meta property="og:title" content="Science Centre Pakistan — Advanced Laboratory Equipment & Analytical Instruments" />
    <meta property="og:description" content="Premier distributor of LABScan3D™ multiplex analyzers, flow cytometers, and molecular biology tools. Serving clinical laboratories, research universities, hospitals, and pharmaceutical companies across Pakistan." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://sciencecentre.com.pk/wp-content/uploads/2021/09/Asset-25.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Science Centre Pakistan" />
    <meta name="twitter:description" content="Pakistan's premier distributor of advanced laboratory equipment and analytical instruments." />
    <link rel="icon" href="https://sciencecentre.com.pk/wp-content/uploads/2021/09/Asset-25-150x150.png" />
    <style>
      html, body, #root { margin: 0; background: #01040a; }
      #root:empty::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(1, 4, 10, 0.96) 0%, rgba(1, 4, 10, 0.74) 48%, rgba(1, 4, 10, 0.5) 100%),
          url("/images/sc-lab-hero-optimized.webp") center / cover no-repeat,
          #01040a;
      }
      #root:empty::after {
        content: "";
        position: fixed;
        left: 50%;
        top: 50%;
        width: min(300px, 48vw);
        height: min(120px, 18vw);
        transform: translate(-50%, -50%);
        background: url("/images/sc-logo-full-nav.webp") center / contain no-repeat;
        animation: scBootLogo 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
        filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.35));
      }
      @keyframes scBootLogo {
        0% {
          opacity: 0;
          clip-path: inset(100% 0 0 0);
          filter: grayscale(1) brightness(1.45) drop-shadow(0 0 8px rgba(56, 189, 248, 0.2));
        }
        45% {
          opacity: 1;
        }
        100% {
          opacity: 1;
          clip-path: inset(0 0 0 0);
          filter: grayscale(0) brightness(1) drop-shadow(0 0 22px rgba(56, 189, 248, 0.35));
        }
      }
    </style>
    <link rel="preload" as="image" href="/images/sc-logo-full-nav.webp" type="image/webp" />
    <link rel="preload" as="image" href="/images/sc-logo-wordmark-only.png" type="image/png" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/sc-lab-hero-optimized.webp" type="image/webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
